name: 'Resolve Next Version'
description: 'Resolves the next publish version from Maven Central or GitHub Releases'
author: 'MobileByteLabs'
branding:
  icon: 'tag'
  color: 'green'

inputs:
  group-id:
    description: 'Maven group ID (e.g. io.github.mobilebytelabs)'
    required: true
  artifact-id:
    description: 'Maven artifact ID (e.g. cmp-clipboard)'
    required: true
  bump:
    description: 'Which part to bump: patch (default), minor, or major'
    required: false
    default: 'patch'

outputs:
  version:
    description: 'The next version to publish'
    value: ${{ steps.resolve.outputs.version }}
  current:
    description: 'The current latest version'
    value: ${{ steps.resolve.outputs.current }}

runs:
  using: 'composite'
  steps:
    - name: Resolve next version
      id: resolve
      shell: bash
      run: |
        GROUP_ID="${{ inputs.group-id }}"
        ARTIFACT_ID="${{ inputs.artifact-id }}"
        BUMP="${{ inputs.bump }}"

        # 1. Try Maven Central
        echo "Querying Maven Central for ${GROUP_ID}:${ARTIFACT_ID}..."
        RESPONSE=$(curl -sf "https://search.maven.org/solrsearch/select?q=g:${GROUP_ID}+AND+a:${ARTIFACT_ID}&rows=1&wt=json" || echo "")

        LATEST=""
        if [ -n "$RESPONSE" ]; then
          LATEST=$(echo "$RESPONSE" | grep -o '"latestVersion":"[^"]*"' | cut -d'"' -f4 || true)
        fi

        # 2. Fallback: GitHub Releases (latest tag)
        if [ -z "$LATEST" ]; then
          echo "Not on Maven Central — checking GitHub Releases..."
          REPO="${GITHUB_REPOSITORY}"
          TAG=$(curl -sf "https://api.github.com/repos/${REPO}/releases/latest" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" 2>/dev/null \
            | grep -o '"tag_name":\s*"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || true)

          # Strip leading 'v' if present
          TAG="${TAG#v}"

          if [ -n "$TAG" ] && echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+'; then
            LATEST="$TAG"
            echo "Found GitHub Release: ${LATEST}"
          fi
        fi

        if [ -z "$LATEST" ]; then
          echo "::error::No version found on Maven Central or GitHub Releases for ${GROUP_ID}:${ARTIFACT_ID}. Create a GitHub Release first."
          exit 1
        fi

        # Parse and bump
        MAJOR=$(echo "$LATEST" | cut -d. -f1)
        MINOR=$(echo "$LATEST" | cut -d. -f2)
        PATCH=$(echo "$LATEST" | cut -d. -f3)

        case "$BUMP" in
          major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
          minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
          *)     NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
        esac

        echo "current=${LATEST}" >> $GITHUB_OUTPUT
        echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
        echo "Resolved: ${GROUP_ID}:${ARTIFACT_ID} current=${LATEST} → next=${NEW_VERSION} (${BUMP} bump)"
      env:
        GITHUB_TOKEN: ${{ github.token }}
