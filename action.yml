name: 'Resolve Next Version'
description: 'Resolves next publish version from explicit input, gradle.properties, GitHub Releases, or Maven Central — with Maven sanity check'
author: 'MobileByteLabs'
branding:
  icon: 'tag'
  color: 'green'

inputs:
  group-id:
    description: 'Maven group ID (e.g. io.github.mobilebytelabs)'
    required: true
  artifact-id:
    description: 'Maven artifact ID — used for verify-against-maven and as the maven-central source'
    required: true
  bump:
    description: 'Which part to bump: patch (default), minor, or major'
    required: false
    default: 'patch'
  version:
    description: 'Explicit version override. If non-empty, used as-is (no bump). Highest priority.'
    required: false
    default: ''
  version-source:
    description: 'Resolution mode: auto (default; runs full priority chain), gradle-properties, github-releases, maven-central'
    required: false
    default: 'auto'
  gradle-properties-path:
    description: 'Path to gradle.properties file (relative to repo root)'
    required: false
    default: 'gradle.properties'
  gradle-properties-key:
    description: 'Key in gradle.properties holding the version (e.g. kmptoolkit.version). Empty disables this source.'
    required: false
    default: ''
  bump-when:
    description: 'Comma-separated sources whose value should be patch-bumped. Defaults bump registry sources only; explicit/gradle-properties used as-is.'
    required: false
    default: 'github-releases,maven-central'
  verify-against-maven:
    description: 'Sanity check: fail if resolved version is not strictly greater than latest on Maven Central'
    required: false
    default: 'true'
  tag-pattern:
    description: 'POSIX ERE for valid GitHub Release tags. Default matches vX.Y.Z and X.Y.Z.'
    required: false
    default: '^v?[0-9]+\.[0-9]+\.[0-9]+$'

outputs:
  version:
    description: 'The next version to publish'
    value: ${{ steps.resolve.outputs.version }}
  current:
    description: 'Resolved current version (before bump, if any)'
    value: ${{ steps.resolve.outputs.current }}
  source:
    description: 'Source used (explicit | gradle-properties | github-releases | maven-central)'
    value: ${{ steps.resolve.outputs.source }}

runs:
  using: 'composite'
  steps:
    - name: Resolve next version
      id: resolve
      shell: bash
      env:
        GROUP_ID: ${{ inputs.group-id }}
        ARTIFACT_ID: ${{ inputs.artifact-id }}
        BUMP: ${{ inputs.bump }}
        EXPLICIT_VERSION: ${{ inputs.version }}
        VERSION_SOURCE: ${{ inputs.version-source }}
        GP_PATH: ${{ inputs.gradle-properties-path }}
        GP_KEY: ${{ inputs.gradle-properties-key }}
        BUMP_WHEN: ${{ inputs.bump-when }}
        VERIFY: ${{ inputs.verify-against-maven }}
        TAG_PATTERN: ${{ inputs.tag-pattern }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        bash "${GITHUB_ACTION_PATH}/resolve.sh"
